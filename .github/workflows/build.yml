name: Build rbserver

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write  # the default GITHUB_TOKEN is otherwise read-only; needed to create/upload releases
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid + dpkg (for .deb packaging)
        run: brew install ldid dpkg

      - name: Install Python deps (build_deb.sh imports wda_ctl.py for its bplist encoder)
        run: pip3 install --break-system-packages -r requirements.txt

      - name: Install Appium + XCUITest driver (vendors WebDriverAgent source)
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Inspect iPhoneOS Swift Testing libraries
        run: |
          echo "=== Xcode ==="
          xcodebuild -version

          PLATFORM="$(xcrun --sdk iphoneos --show-sdk-platform-path)"
          echo "Platform: $PLATFORM"

          echo "=== Library paths ==="
          find "$PLATFORM/Developer" \
            \( -name 'lib_TestingInterop.dylib' -o -name '_Testing_Foundation.framework' \) \
            -print 2>/dev/null

          echo "=== Interop symbols ==="
          INTEROP="$PLATFORM/Developer/usr/lib/lib_TestingInterop.dylib"

          if [ -f "$INTEROP" ]; then
            file "$INTEROP"
            xcrun nm -g "$INTEROP" | grep 'swift_testing_getFallbackEventHandler' || true
          else
            echo "Interop library not found at expected location"
          fi

          echo "=== Foundation framework ==="
          ls -la "$PLATFORM/Developer/Library/Frameworks/_Testing_Foundation.framework" || true
      - name: Build WDA
        run: ./scripts/build_wda.sh

      - name: Package .deb
        # Strip the leading "v" so a v1.0.1 tag produces rbserver_1.0.1_...deb,
        # matching the release it gets attached to below; build_deb.sh defaults
        # to 1.0.0 on non-tag builds (push to main, manual dispatch).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="1.0.0"; fi
          ./scripts/build_deb.sh "$VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbserver-deb
          path: build/*.deb

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # `gh release upload` needs an existing Release object, which a plain
        # `git tag && git push` doesn't create (confirmed live: "release not
        # found") -- `gh release create --generate-notes` makes one if it's
        # missing, or the --clobber upload just fills in the asset if it
        # already exists.
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" build/*.deb --clobber
